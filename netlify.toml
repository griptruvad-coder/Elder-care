# Netlify serves the website from public/. Every /api request is passed to the backend on Render,
# so login cookies, payments and the database keep working exactly as before.
# If the Render URL changes, update it in the [[redirects]] block below.

[build]
  publish = "public"
  command = ""

[[redirects]]
  from = "/api/*"
  to = "https://elder-care-2nje.onrender.com/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://*.razorpay.com https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.razorpay.com https://accounts.google.com/gsi/; frame-src https://*.razorpay.com https://accounts.google.com/gsi/; form-action 'self'; object-src 'none'; base-uri 'self'"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
