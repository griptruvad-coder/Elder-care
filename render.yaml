# Render Blueprint: one web service (website + API) and one Postgres database.
# In Render: New + → Blueprint → pick this repo. Fill the "sync: false" values when asked.
services:
  - type: web
    name: apnasa
    runtime: node
    plan: free            # free sleeps after 15 min idle; use "starter" for always-on
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: apnasa-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAILS          # founder's email(s), comma separated
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PLAN_BASIC
        sync: false
      - key: RAZORPAY_PLAN_PREMIUM
        sync: false
      - key: RAZORPAY_PLAN_SUPER_PREMIUM
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false

databases:
  - name: apnasa-db
    plan: free             # FREE DATABASE IS DELETED AFTER 30 DAYS (+14 day grace). Upgrade to basic-256mb before real customers.
    databaseName: apnasa
    user: apnasa
